<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamour Minesweeper 🍓</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Переключатель сложности -->
    <div class="difficulty-selector">
        <button class="diff-btn active" data-mode="basic">🍓 Базовый гламур</button>
        <button class="diff-btn" data-mode="luxury">💎 Люксовый гламур</button>
    </div>

    <div class="game-container">
        <header class="game-header">
            <div class="counter mine-counter" id="mine-counter">040</div>
            <button class="reset-btn" id="reset-btn" aria-label="Начать заново">
                <span class="reset-icon">🙂</span>
            </button>
            <div class="counter timer" id="timer">000</div>
        </header>
        
        <div class="grid" id="grid"></div>
        
        <!-- Кнопки справа от поля (абсолютное позиционирование) -->
        <button class="stats-btn" id="stats-btn" aria-label="Статистика">📊</button>
        <button class="settings-btn" id="settings-btn" aria-label="Настройки">⚙️</button>
        
        <!-- Отображение рекорда -->
        <div class="record-display" id="record-display">
            🏆 Рекорд: <span id="record-time">---</span>
        </div>

        <!-- Кнопка продолжить сохранённую игру -->
        <button class="continue-btn" id="continue-btn" style="display: none;">
            ▶️ Продолжить сохранённую игру
        </button>
    </div>

    <!-- Оверлей победы -->
    <div class="overlay" id="win-overlay">
        <div class="overlay-content win-content">
            <div class="overlay-text">Мур мур гламур</div>
            <div class="overlay-emoji">✨</div>
        </div>
    </div>

    <!-- Оверлей поражения -->
    <div class="overlay" id="lose-overlay">
        <div class="overlay-content lose-content">
            <div class="overlay-text">Пу-пу-пу</div>
            <div class="overlay-emoji">💥</div>
        </div>
    </div>

    <!-- Модальное окно настроек -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>️ Настройки</h2>
                <button class="modal-close" id="settings-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label class="setting-label">Автооткрытие соседей:</label>
                    <div class="setting-options">
                        <label class="radio-label">
                            <input type="radio" name="auto-open" value="double" checked>
                            <span>Двойной клик</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="auto-open" value="single">
                            <span>Одинарный клик (по цифре)</span>
                        </label>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label class="setting-label">Тема оформления:</label>
                    <div class="setting-options">
                        <label class="radio-label">
                            <input type="radio" name="theme" value="light" checked>
                            <span>🌸 Светлая</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="theme" value="dark">
                            <span> Тёмная</span>
                        </label>
                    </div>
                </div>

                <div class="setting-group">
                    <label class="setting-label">Тряска экрана при проигрыше:</label>
                    <div class="setting-options">
                        <label class="radio-label">
                            <input type="radio" name="shake" value="on">
                            <span>Включена</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="shake" value="off" checked>
                            <span>Выключена</span>
                        </label>
                    </div>
                </div>

                <div class="setting-group">
                    <label class="setting-label">Автосохранение:</label>
                    <div class="setting-options">
                        <label class="radio-label">
                            <input type="radio" name="autosave" value="on" checked>
                            <span>Включено</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="autosave" value="off">
                            <span>Выключено</span>
                        </label>
                    </div>
                </div>

                <button class="clear-save-btn" id="clear-stats-btn">🗑️ Очистить статистику</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно статистики и достижений -->
    <div class="modal" id="stats-modal">
        <div class="modal-content stats-modal-content">
            <div class="modal-header">
                <h2>📊 Статистика</h2>
                <button class="modal-close" id="stats-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="stats-section">
                    <h3 class="stats-title">📈 Общая статистика</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="stat-total">0</div>
                            <div class="stat-label">Всего игр</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-wins">0</div>
                            <div class="stat-label">Побед</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-percent">0%</div>
                            <div class="stat-label">Процент побед</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-streak">0</div>
                            <div class="stat-label">Текущая серия</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-best-streak">0</div>
                            <div class="stat-label">Лучшая серия</div>
                        </div>
                    </div>
                </div>

                <div class="stats-section">
                    <h3 class="stats-title">⏱️ Лучшие времена</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="stat-best-basic">---</div>
                            <div class="stat-label">🍓 Базовый гламур</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-best-luxury">---</div>
                            <div class="stat-label">💎 Люксовый гламур</div>
                        </div>
                    </div>
                </div>

                <div class="stats-section">
                    <h3 class="stats-title">🏆 Достижения (<span id="achievements-count">0</span>/8)</h3>
                    <div class="achievements-grid" id="achievements-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Уведомление о достижении -->
    <div class="achievement-toast" id="achievement-toast">
        <div class="toast-icon">🏆</div>
        <div class="toast-content">
            <div class="toast-title">Достижение получено!</div>
            <div class="toast-name" id="toast-achievement-name"></div>
        </div>
    </div>

    <!-- Canvas для конфетти -->
    <canvas id="confetti-canvas"></canvas>

    <script src="app.js"></script>
</body>
</html>
